<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CampusFix</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1 id="appTitle">CampusFix</h1>
    <p>Campus Infrastructure & Maintenance Issue Tracker</p>
  </header>
  <main>
    <div class="card">
      <strong>Submit a new item</strong>
      <div class="flow">
        <span>1. Browser</span><span>&rarr;</span><span>2. API Gateway</span><span>&rarr;</span><span>3. Lambda</span><span>&rarr;</span><span>4. DynamoDB</span>
      </div>
      
      <label for="description">Description</label>
      <textarea id="description" placeholder="Describe the issue or idea..."></textarea>
      <label for="category">Category</label>
      <select id="category">
        <option value="Electrical">Electrical</option>
        <option value="Plumbing">Plumbing</option>
        <option value="Furniture">Furniture</option>
        <option value="Internet / Wi-Fi">Internet / Wi-Fi</option>
        <option value="Classroom Equipment">Classroom Equipment</option>
        <option value="Other">Other</option>
      </select>
      <label for="location">Location</label>
      <input id="location" type="text" placeholder="e.g. Room 204, 2nd Floor" />
      
      <label for="description">Description</label>
      <textarea id="description" placeholder="Describe the maintenance problem..."></textarea>
      
      <label for="participantName">Reported by (Your Name)</label>
      <input id="participantName" type="text" placeholder="e.g. Rahul Sharma" />
      
      <button id="submitBtn">Report Issue</button>
      <div id="status"></div>
    </div>

    <div class="card">
      <strong>Recent items (live from DynamoDB)</strong>
      <div id="list" style="margin-top: 10px;">Loading&hellip;</div>
    </div>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
