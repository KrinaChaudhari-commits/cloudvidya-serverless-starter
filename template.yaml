AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  CloudVidya starter project — Frontend -> API Gateway -> Lambda -> DynamoDB.
  One Lambda function (backend/app.py) routes every request itself, matching
  the Day 2 "Backend walkthrough" session.

Globals:
  Function:
    Runtime: python3.14
    Timeout: 10
    MemorySize: 128
    Environment:
      Variables:
        TABLE_NAME: !Ref ItemsTable
  Api:
    Cors:
      AllowMethods: "'GET,POST,PATCH,OPTIONS'"
      AllowHeaders: "'Content-Type'"
      AllowOrigin: "'*'"

Resources:
  # ---------------------------------------------------------------
  # DynamoDB
  # ---------------------------------------------------------------
  ItemsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-items"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  # ---------------------------------------------------------------
  # Lambda — one function, routes GET /health, POST /items, GET /items,
  # PATCH /items/{id}. SAM auto-generates a least-privilege role, scoped
  # to only this table.
  # ---------------------------------------------------------------
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.handler
      CodeUri: backend/
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ItemsTable
      Events:
        HealthApi:
          Type: Api
          Properties:
            Path: /health
            Method: get
        CreateItemApi:
          Type: Api
          Properties:
            Path: /items
            Method: post
        ListItemsApi:
          Type: Api
          Properties:
            Path: /items
            Method: get
        UpdateItemApi:
          Type: Api
          Properties:
            Path: /items/{id}
            Method: patch

  # ---------------------------------------------------------------
  # Frontend hosting note: this template does NOT create an Amplify app.
  # Day 2's agenda connects this repo to Amplify Hosting through the AWS
  # Console (Amplify > Host web app > pick this GitHub repo) so students
  # see the Git-push-to-deploy flow directly — see docs/project-guide.md.
  # ---------------------------------------------------------------

Outputs:
  ApiUrl:
    Description: API Gateway base URL — paste this into frontend/config.js as API_BASE
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
  ItemsTableName:
    Description: DynamoDB table name — open this in the console during the live demo
    Value: !Ref ItemsTable
